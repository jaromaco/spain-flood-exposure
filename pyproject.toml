[project]
name = "spain-flood-exposure"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.43.102",
    "geopandas>=1.1.4",
    "pyarrow>=25.0.1",
    "requests>=2.34.2",
    "shapely>=2.1.2",
]

[project.scripts]
spain-flood-exposure = "spain_flood_exposure:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyterlab>=4.6.4",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
